name: Android CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'jetbrains'

    - name: Grant execute permission for gradlew
      run: |
        cd apps/android
        chmod +x gradlew

    - name: Generate signing keys
      run: |
        cd apps/android
        echo ${{ secrets.SIGNING_KEY }} | base64 -d > app/sign_key.jks
        cat > keystore.properties << EOF
        storeFile=sign_key.jks
        storePassword=${{ secrets.KEYSTORE_PASSWD }}
        keyAlias=${{ secrets.KEYALIAS }}
        keyPassword=${{ secrets.KEYALIAS_PASSWD }}
        EOF

    - name: Build with Gradle
      run: |
        cd apps/android
        echo "OAUTH_CLIENT_ID=${{ secrets.CLIENT_ID }}" >> local.properties
        ./gradlew :app:assembleOssRelease

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: orange-cloud
        path: apps/android/app/build/outputs/apk/
        compression-level: 9

    - name: Generate release tag
      id: tag
      if: (!cancelled())
      run: |
        echo "release_tag=$(grep -m1 'versionName *=' "apps/android/app/build.gradle.kts" | sed -E 's/.*"(.*)".*/\1/')" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload apk to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: v${{ steps.tag.outputs.release_tag }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: apps/android/app/build/outputs/apk/*/*/*
        prerelease: true
